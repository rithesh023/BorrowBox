services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 8900
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8900:8900"
    volumes:
      - borrowbox-uploads:/app/uploads
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8900/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  borrowbox-uploads:
