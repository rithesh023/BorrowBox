spring.application.name=borrowbox-api
# Load local backend secrets from backend/.env (ignored by Git).
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8900}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Recycle database connections before remote MySQL/network idle timeouts close them.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.chat-completions-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.upload.directory=${UPLOAD_DIR:uploads}
